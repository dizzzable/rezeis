name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rezeis-admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rezeis-admin/package-lock.json

      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck

      # `typecheck` above compiles `tsconfig.json`, which EXCLUDES `**/*.spec.ts`
      # — so it returns exit 0 with the whole suite hard-broken. And the tests
      # job does NOT type-check the specs either: `npm test` loads them through
      # `ts-node/register/transpile-only`, which strips types without checking
      # them, so a spec with a type error runs and can pass. This step is
      # therefore the only type check the specs and every file under `test/`
      # get. (This comment used to say the tests job checks them at run time;
      # the script had changed underneath it. Corrected 13.09.2026.)
      - run: npm run typecheck:test

      - run: npm run lint

      # Nothing above ever evaluates the built server. Typecheck, lint and even
      # `nest build` all pass on a dependency graph Nest cannot resolve: a
      # provider missing from its module, or — on NestJS 12, which stops
      # inheriting `@Optional()` metadata — an injectable whose optional
      # dependency silently became required. Both the API and the worker then
      # abort at start and restart in a loop, with every static check green.
      # `smoke:boot` builds the whole AppModule graph in Nest's preview mode
      # from `dist/`, with no database and no `.env`, in a few seconds. It is
      # the one check here that has seen the process start.
      - run: npm run build
      - run: npm run smoke:boot

  web-quality:
    name: Web quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rezeis-admin/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rezeis-admin/web/package-lock.json

      - run: npm ci
      # `typecheck` compiles `tsconfig.app.json`, the PRODUCTION project. It
      # excludes tests on purpose: the Docker frontend stage is `COPY web/ .`
      # and nothing else, so anything this project compiles must live under
      # `web/`. A test that reaches into the backend is legitimate and is
      # covered by `typecheck:test` below, which runs where the whole
      # repository exists. Keeping them separate is what stops a green local
      # run from shipping an image that cannot build.
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # Assert facts about the EMITTED graph in `dist/`, which only exists
      # after the step above — hence a separate step and not part of
      # `npm test`.
      #
      # `src/vite-manual-chunks.test.ts` (which DOES run under `npm test`
      # above) pins the `manualChunks` decision function and cannot catch
      # what this catches. The 449 KB charts bundle that shipped as a
      # `modulepreload` on /sign-in got there while that function returned
      # the correct group for React: rolldown copied React's CJS entry into
      # `vendor-charts` anyway and the entry chunk bound to it. A right
      # answer and a wrong bundle. Only the build output shows that.
      #
      # Reads dist/index.html, walks the entry's static-import closure plus
      # the locale chunk main.tsx awaits before first paint, and fails if a
      # chunk on it contains three.js or recharts/d3 (matched by
      # library-internal content and sourcemap attribution, never by chunk
      # name) or if the render-blocking payload exceeds its byte/chunk
      # ceiling.
      - run: npm run check:build-graph

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rezeis-admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rezeis-admin/package-lock.json

      - run: npm ci
      - run: npm run prisma:generate
      # `npm test` registers ts-node in TRANSPILE-ONLY mode, and that is the
      # difference between a five-minute job and a twenty-five-minute one.
      #
      # Node's test runner spawns a process per spec file — around 340 of them
      # — and a type-checking ts-node made every one of those processes compile
      # and CHECK the whole graph it imports, from scratch. Measured on the
      # full suite: 335s with checking, 76s without, same 5526 tests passing.
      #
      # Nothing is lost, because the check was redundant here rather than
      # unique: `backend-quality` runs `npm run typecheck:test`, which compiles
      # `tsconfig.test.json` — every file under `test/`, including the ones no
      # spec imports, which the run-time check never reached at all. That job
      # is the type authority for the suite; this one is the behaviour
      # authority. Doing both in both places bought nothing and cost twenty
      # minutes a push.
      - name: Run backend test suite
        run: npm test

  postgres-concurrency:
    name: PostgreSQL concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rezeis_test
          POSTGRES_PASSWORD: rezeis_test
          POSTGRES_DB: rezeis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rezeis_test -d rezeis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rezeis_test:rezeis_test@127.0.0.1:5432/rezeis_test
      TEST_DATABASE_URL: postgresql://rezeis_test:rezeis_test@127.0.0.1:5432/rezeis_test
    defaults:
      run:
        working-directory: rezeis-admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rezeis-admin/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      # Every spec that needs a real database, not a hand-picked two.
      #
      # These files skip silently without TEST_DATABASE_URL, which means they
      # do not run in `backend-tests` either — so a spec left off this list
      # runs nowhere and guards nothing. They are the ones proving the
      # properties no unit test can reach: two spins racing for the last
      # prize, a ceiling under concurrent claims, a refused edit rolling back,
      # a key handed to exactly one winner, a contest drawn exactly once.
      # ONE FILE AT A TIME. These specs share a single database and two of
      # them clear the whole wheel tables (`wheelSector.deleteMany({})`), so
      # concurrent files delete each other’s rows: on a 16-thread machine the
      # same 14 files give 6 failures and one aborted file, and pass 161/161
      # serially. Node defaults to cores-1 files at once, so CI four vCPUs made
      # it rare rather than impossible — this makes the job deterministic.
      - run: >-
          node --require ts-node/register/transpile-only --test --test-concurrency=1
          test/add-on-entitlement-postgres-concurrency.spec.ts
          test/subscription-index-migration.spec.ts
          test/points-wallet-postgres.spec.ts
          test/points-cashback-postgres.spec.ts
          test/spin-wallet-postgres.spec.ts
          test/wheel-spin-postgres.spec.ts
          test/wheel-config-postgres.spec.ts
          test/wheel-key-pool-postgres.spec.ts
          test/wheel-manual-prize-postgres.spec.ts
          test/wheel-cabinet-postgres.spec.ts
          test/contests-postgres.spec.ts
          test/connect-page-postgres.spec.ts
          test/device-limit-provenance-postgres.spec.ts
          test/subscription-device-limit-reduction.spec.ts
          test/plan-delete-postgres.spec.ts
          test/settings-row-lock-postgres.spec.ts
          test/referral-rewards-postgres.spec.ts
          test/plan-migration-postgres.spec.ts
          test/payment-plan-migration-guard-postgres.spec.ts
          test/user-hint-delivery-postgres.spec.ts
          test/automation-empty-conditions-postgres.spec.ts
          test/analytics-surfaces-postgres.spec.ts
          test/analytics-reports-postgres.spec.ts
          test/web-first-password-postgres.spec.ts
          test/account-merge-recovery-hold-postgres.spec.ts
          test/imported-payments-backfill-postgres.spec.ts
          test/moy-nalog-receipt-race-postgres.spec.ts
          test/payment-analytics-postgres.spec.ts
          test/dashboard-revenue-postgres.spec.ts
