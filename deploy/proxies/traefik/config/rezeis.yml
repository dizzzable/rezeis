# Traefik dynamic configuration for the rezeis panel (443-only, BYO cert).
# Replace REPLACE_WITH_YOUR_DOMAIN with the panel hostname.

http:
  routers:
    rezeis:
      rule: "Host(`REPLACE_WITH_YOUR_DOMAIN`)"
      entrypoints:
        - https
      tls: {}
      middlewares:
        - hsts
      service: rezeis

  middlewares:
    # HSTS — one year. After one visit, browsers refuse plaintext HTTP to
    # this host until the max-age expires.
    #
    # `stsIncludeSubdomains` is a commitment, not just a hardening flag: it
    # pins HTTPS for EVERY name under this one. If this host ever shares an
    # apex with another (e.g. panel.example.com and app.example.com both
    # under example.com), the header served from either one applies to the
    # whole example.com tree — including subdomains that have no cert yet,
    # which then become unreachable in any browser that saw the header, for
    # a year. If your DNS layout makes that risky, set this to false; the
    # stsSeconds max-age alone still protects this host.
    #
    # `stsPreload` is deliberately omitted (it defaults to false). Preload
    # is a one-way submission to browser vendors — removal takes months and
    # rides browser release trains. Add it only as a separate, conscious
    # decision.
    #
    # No `forceSTSHeader` needed: the https entrypoint is TLS-only, and
    # Traefik emits the header on TLS requests without it. This middleware
    # must stay attached to the router above — an unattached middleware is
    # silently inert, which is how HSTS most often goes missing in Traefik.
    hsts:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true

    # No request-body limit is set on this stack, and Traefik imposes none
    # of its own. The panel's per-route application limits are therefore
    # the ONLY ceiling here: broadcast video 50 MB, FAQ media 25 MB,
    # imports 100 MB, backup restore 1 GiB (2 GiB hard cap). The nginx and
    # angie templates, by contrast, cap at 64m at the edge — so they 413
    # imports and backup restores that this stack passes through fine.
    # To add an edge ceiling, define a buffering middleware and attach it
    # to the router above alongside `hsts`:
    #   body-limit:
    #     buffering:
    #       maxRequestBodyBytes: 67108864   # 64 MiB
    # Note buffering makes Traefik spool the body to disk before
    # forwarding, which breaks streaming uploads — size it deliberately.

  services:
    rezeis:
      loadBalancer:
        servers:
          - url: "http://rezeis:8000"
