# Traefik static configuration (443-only, bring-your-own cert).
# No ACME, no :80 entrypoint. TLS certs are loaded from the dynamic
# file provider (see config/tls.yml).

api:
  dashboard: false
  debug: false

entryPoints:
  https:
    address: ":443"
    # Real client IP — not needed today, REQUIRED if you ever put a CDN
    # (Cloudflare) in front of this VPS.
    #
    # Today this box terminates TLS directly, so the peer address IS the
    # client. Behind a CDN, every request arrives from an edge address. If
    # the app then treats that edge as the client:
    #   - this panel auto-blocks for 30 MINUTES on repeated failed logins,
    #     so one attacker behind a Cloudflare datacentre locks out every
    #     operator routed through it;
    #   - the reiwa cabinet bans an offending IP for 24 HOURS — same blast
    #     radius, far longer fuse.
    # Rate limiting, abuse heuristics and audit logs all go wrong the same
    # way, invisibly, until users complain.
    #
    # TRAEFIK IS THE WORST OF THE FOUR STACKS HERE. nginx, angie and caddy
    # forward a wrong-but-present client address when they have not been
    # told whom to trust. Traefik, when the peer is NOT in trustedIPs,
    # STRIPS every X-Forwarded-* header instead of shifting/appending them
    # — so the client address is destroyed outright, not merely wrong, and
    # there is nothing downstream for the app to recover it from.
    #
    # Traefik also has no equivalent of nginx's `real_ip_header
    # CF-Connecting-IP`: it only understands X-Forwarded-For. Behind
    # Cloudflare you must trust the CF ranges below and rely on the
    # X-Forwarded-For that Cloudflare sets.
    #
    # To enable: fetch the CURRENT ranges from Cloudflare's published list
    # at https://www.cloudflare.com/ips/ (IPv4 and IPv6 — they change over
    # time). Never use 0.0.0.0/0: that trusts every peer and lets any
    # client forge its own address.
    #
    # forwardedHeaders:
    #   trustedIPs:
    #     - "<cloudflare-cidr>"
    #     - "<cloudflare-cidr>"
    #
    # The sibling stacks need their own equivalent:
    #   nginx/angie — `set_real_ip_from` + `real_ip_header CF-Connecting-IP`
    #   caddy       — `servers { trusted_proxies static <ranges> }`

    # ── Client-side deadlines (browser → traefik) ─────────────────────
    #
    # `writeTimeout` is deliberately ABSENT. It bounds the whole span from the
    # end of the request headers to the end of the response WRITE, so any
    # non-zero value is a hard cap on how long a response may take to FINISH --
    # and this panel has a response that is supposed to never finish
    # (`/api/internal/user/<userRef>/stream`, text/event-stream, which the
    # reiwa cabinet holds open for hours). Worse, it is an ENTRYPOINT setting
    # with no per-router override, so a value added here while "adding timeouts
    # to Traefik" would cut every subscriber off at exactly that age, with
    # nothing in the log naming the cause. Traefik leaves it at 0 (no limit);
    # keep it that way.
    #
    # `readTimeout` is pinned at 120s rather than left to Traefik's own v3
    # default, which is ALSO 60s -- and 60s is too short here. It bounds
    # reading the entire request INCLUDING THE BODY, and this panel accepts
    # uploads that are large by design: imports at 100 MB, backup restore at
    # 1 GiB (2 GiB hard). 120s matches the app's own ceiling for those routes
    # (`RequestTimeoutMiddleware`, UPLOAD_TIMEOUT_MS) so the edge is never the
    # thing that says no first.
    #
    # NOTE the app-side caveat before raising it further: `restore-upload` does
    # NOT match that middleware's long-timeout list (the pattern is
    # `/admin/backup/restore/`, with a slash, and the route is
    # `restore-upload`), so the application currently gives a 2 GiB restore
    # only its 30s default. Raising this number alone will not buy a bigger
    # upload window until that is fixed.
    transport:
      respondingTimeouts:
        readTimeout: 120s
        # How long an idle keep-alive client connection is held.
        idleTimeout: 180s

# ── Default backend transport (traefik → rezeis) ────────────────────────
#
# This is the transport every service gets unless it names its own. The
# `forwardingTimeouts` block below is the fix for a real gap: Traefik ships
# `responseHeaderTimeout` at 0, which means NO TIMEOUT. An upstream that
# accepts the connection and then goes silent therefore holds the request open
# forever -- the browser tab spins, and neither Traefik nor the app logs
# anything, because from Traefik's side nothing has gone wrong yet. The same
# mistake in the cabinet's own proxy config took the cabinet down in
# production.
#
# 120s is the app's own ceiling for the slowest routes on this transport
# (broadcast media upload, FAQ uploads and backup download are each granted
# 120s by `RequestTimeoutMiddleware`, everything else 30s). Lower would 504
# requests the app was still lawfully serving; higher would put the edge back
# in the business of waiting on a dead upstream. The stream route opts out of
# it by naming its own transport in config/rezeis.yml.
#
# `dialTimeout` 5s replaces Traefik's 30s default: rezeis is a sibling
# container on this host's docker network, and if it has not accepted a
# connection in 5s it is not going to.
serversTransport:
  insecureSkipVerify: true
  forwardingTimeouts:
    dialTimeout: 5s
    responseHeaderTimeout: 120s
    idleConnTimeout: 90s

providers:
  file:
    directory: /config
    watch: true

log:
  level: "INFO"
  filePath: "/var/log/traefik/traefik.log"

accessLog:
  filePath: "/var/log/traefik/access.log"
