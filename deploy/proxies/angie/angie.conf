# rezeis panel — Angie reverse proxy (443-only, bring-your-own cert)
#
# Replace REPLACE_WITH_YOUR_DOMAIN with the panel hostname.
# No ACME, no port 80. Provide your own certificate as fullchain.pem +
# privkey.key next to this file (mounted into /etc/angie/ssl):
#   ../gen-self-signed-cert.sh panel.example.com .

# ── No `upstream` block, on purpose ─────────────────────────────────────────
#
# `upstream rezeis { server rezeis:8000; }` resolves the name while angie is
# STARTING: with no `rezeis` container yet it refuses to start at all (while
# the README tells you to bring the proxy up first), and once started it caches
# the address for the life of the worker, so recreating the container leaves it
# proxying to a dead IP until reload.
#
# The locations below set the host in a VARIABLE, which defers resolution to
# request time using the resolver named here.
#
# This replaces a public-DNS `resolver` that was declared and never used — this
# file has no `ssl_stapling`, which is the only other thing that needs one.
# Docker's embedded DNS also forwards non-container names upstream, so adding
# stapling later needs no second resolver. (The nginx sibling keeps its public
# resolver at server level for exactly that reason and scopes the Docker one to
# each location instead — the asymmetry is deliberate, not drift.)
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name REPLACE_WITH_YOUR_DOMAIN;

    listen 443 ssl reuseport;
    listen [::]:443 ssl reuseport;
    http2 on;

    # Edge request-body ceiling. Replaces Angie's 1 MB default.
    #
    # Sized for the panel's MEDIA uploads: broadcast video 50 MB, FAQ media
    # 25 MB, bot-flow media 20 MB, bot-config banners 8 MB. 64m clears the
    # 50 MB largest of those with headroom for multipart/form-data framing.
    # The previous 32m silently 413'd a legal 50 MB broadcast upload here,
    # at the edge, before the app could return its own error message.
    #
    # Two route families legitimately exceed 64m — backup restore-upload
    # and the four file-based importers. They are NOT handled by raising
    # this number; they get their own per-path `location` blocks further
    # down, so the raised ceiling applies only to them. See the
    # "Per-path body limits" section below.
    client_max_body_size 64m;

    # HSTS — one year. After one visit, browsers refuse plaintext HTTP to
    # this host until the max-age expires.
    #
    # `includeSubDomains` is a commitment, not just a hardening flag: it
    # pins HTTPS for EVERY name under this one. If this host ever shares an
    # apex with another (e.g. panel.example.com and app.example.com both
    # under example.com), the header served from either one applies to the
    # whole example.com tree — including subdomains that have no cert yet,
    # which then become unreachable in any browser that saw the header, for
    # a year. If your DNS layout makes that risky, drop `includeSubDomains`;
    # the max-age alone still protects this host.
    #
    # `always` is required so the header is also sent on error responses
    # (4xx/5xx), not just 2xx/3xx.
    #
    # Inheritance trap: nginx/angie `add_header` is NOT inherited into a
    # `location` that declares its own `add_header` — it replaces the whole
    # inherited set. If you ever add an `add_header` to the `location /`
    # below (or any new location), you MUST repeat this line there or HSTS
    # silently vanishes for that path. As of this file, no location sets
    # any add_header, so the server-level directive covers everything.
    #
    # Deliberately NOT `preload`. Preload is a one-way submission to browser
    # vendors — removal takes months and rides browser release trains. Add
    # it only as a separate, conscious decision.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -----------------------------------------------------------------
    # Real client IP — not needed today, REQUIRED if you ever put a CDN
    # (Cloudflare) in front of this VPS.
    #
    # Today this box terminates TLS directly, so $remote_addr is the real
    # client and the X-Forwarded-For set below is correct.
    #
    # Put Cloudflare (or any proxy/CDN) in front without enabling the
    # directives below and every request arrives from an edge address. The
    # app then treats that edge as the client, and:
    #   - this panel auto-blocks for 30 MINUTES on repeated failed logins,
    #     so one attacker behind a Cloudflare datacentre locks out every
    #     operator routed through it;
    #   - the reiwa cabinet bans an offending IP for 24 HOURS — same blast
    #     radius, far longer fuse.
    # Rate limiting, abuse heuristics and audit logs all become wrong in
    # the same way, and the damage is invisible until users complain.
    #
    # To enable: fetch the CURRENT ranges from Cloudflare's published list
    # at https://www.cloudflare.com/ips/ (IPv4 and IPv6 — they change over
    # time) and write one `set_real_ip_from` per CIDR. Never substitute
    # 0.0.0.0/0: that trusts every peer and lets any client forge its own
    # address.
    #
    # set_real_ip_from <cloudflare-cidr>;   # one line per CIDR, IPv4 + IPv6
    # real_ip_header CF-Connecting-IP;
    #
    # The other stacks in this folder need their own equivalent:
    #   caddy   — `servers { trusted_proxies static <ranges> }`
    #   traefik — `entryPoints.https.forwardedHeaders.trustedIPs`
    # Traefik is the worst of the four here: when the peer is NOT trusted
    # it STRIPS every X-Forwarded-* header instead of shifting/appending,
    # so the client address is destroyed outright rather than merely wrong.
    # -----------------------------------------------------------------

    # SSL Configuration (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:1m;
    ssl_session_tickets off;
    ssl_certificate /etc/angie/ssl/fullchain.pem;
    ssl_certificate_key /etc/angie/ssl/privkey.key;

    # ==== Per-path body limits ==========================================
    # The 64m above is the default for everything. The two route families
    # below legitimately exceed it and get their own ceiling, so the proxy
    # stops being the thing that says no: each of these endpoints re-checks
    # the real limit in the application and returns a proper error rather
    # than a bare edge 413.
    #
    # These are SIBLING locations. Angie inherits `proxy_pass` and
    # `proxy_set_header` from `server`, NOT from `location /`, so the proxy
    # directives are repeated verbatim in each block below. If you change
    # the set in `location /`, change it here too — they must not drift.
    #
    # Both use a regex location with an optional trailing slash rather than
    # a prefix match. A prefix `location /api/admin/imports/` would NOT be
    # narrow enough: that controller also serves GET /, GET /:importId,
    # POST /remnawave, POST /remnawave/sync, POST /assign-plan,
    # POST /:importId/cancel, POST /:importId/rollback,
    # GET /:importId/plan-preview and POST /:importId/clone-plans — nine
    # small-JSON siblings that would silently inherit the raised ceiling.

    # POST /api/admin/backup/restore-upload — application cap is 1 GiB by
    # default and 2 GiB hard (DEFAULT/HARD_MAX_UPLOAD_BYTES, overridable
    # via env BACKUP_MAX_UPLOAD_BYTES; admin-backup.controller.ts:120-121,
    # 151). 2g here matches the hard cap so the app owns the policy.
    # Sibling backup routes (GET /, POST /, settings, :id,
    # restore/:filename, download/:filename) stay at the 64m default.
    location ~ ^/api/admin/backup/restore-upload/?$ {
        client_max_body_size 2g;

        # Angie spools the whole request body to disk before forwarding
        # (proxy_request_buffering is on by default), so a 2 GiB restore
        # needs 2 GiB free in the container's client_body_temp_path.
        # Uncomment to stream straight to the app instead — removes the
        # disk requirement, but the upload can no longer be retried
        # against another upstream (there is only one here anyway):
        # proxy_request_buffering off;

        proxy_http_version 1.1;
        set $rezeis_upstream rezeis:8000;
        proxy_pass http://$rezeis_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # POST /api/admin/imports/{3xui,remnashop,altshop,stealthnet} — each
    # accepts 100 MB (FileInterceptor fileSize 100 * 1024 * 1024;
    # admin-imports.controller.ts:178,203,228,253). 128m leaves headroom
    # for multipart framing above that. Listed explicitly so no sibling
    # route on the same controller is widened.
    location ~ ^/api/admin/imports/(3xui|remnashop|altshop|stealthnet)/?$ {
        client_max_body_size 128m;

        proxy_http_version 1.1;
        set $rezeis_upstream rezeis:8000;
        proxy_pass http://$rezeis_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    # ====================================================================

    location / {
        proxy_http_version 1.1;
        set $rezeis_upstream rezeis:8000;
        proxy_pass http://$rezeis_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # SSE (realtime) / websocket keep-alive.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
}

# Stealth default server: reject non-matching SNI.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}
